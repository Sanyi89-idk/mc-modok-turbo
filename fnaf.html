<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="fnaf.css">

<title>FNAF</title>

<style>

body {
    background: black;
    color: white;
    text-align: center;
    font-family: Arial;
}


/* IT'S ME szöveg */

#itsme {

    display: none;
    position: fixed;
    inset: 0;

    background: black;
    color: white;

    font-size: 80px;
    font-weight: bold;

    justify-content: center;
    align-items: center;

    cursor: pointer;

}



/* Golden Freddy jumpscare */

#golden {

    display: none;

    position: fixed;
    inset: 0;

}


#golden img {

    width: 100%;
    height: 100%;

    object-fit: cover;

}

</style>

</head>


<body>

<div id="counter">0/50</div>

<h1 class="gold">Freddy Fazbear's Pizza</h1>

<p class="gold">
Egy furcsa éjszaka kezdődik...
</p>


<div class="glitch-text">

    <p class="text1" id="purpleGuy">PURPLE GUY</p>

    <p class="text2">HELP</p>

    <p class="text3">1987</p>

    <p class="text4">RUN</p>

</div>



<div id="itsme">

    IT'S ME

</div>



<div id="golden">

<img id="goldenImage" src="Gf2.jpg">

</div>



<audio id="jumpscareSound">

<source src="GOLDEN-JUPMSCARE.ogg" type="audio/mpeg">

</audio>


<div id="spring">

    <img src="spring.jpg">

</div>

<script>


const itsme = document.getElementById("itsme");
const golden = document.getElementById("golden");
const sound = document.getElementById("jumpscareSound");

const counter = document.getElementById("counter");
const purpleGuy = document.getElementById("purpleGuy");
const spring = document.getElementById("spring");




let clicks = 0;
let textSize = 20;


// 1 perc után megjelenik

setTimeout(()=>{


    itsme.style.display = "block";


    let startX = Math.random() * 80;
    let startY = Math.random() * 80;


    itsme.style.left = startX + "%";
    itsme.style.top = startY + "%";


    itsme.classList.add("shake");



    // lassan középre megy és nő

    setTimeout(()=>{


        itsme.style.left = "50%";
        itsme.style.top = "50%";

        itsme.style.transform = "translate(-50%, -50%)";

        itsme.style.fontSize = "120px";


    },500);



},60000);





// kattintások

itsme.addEventListener("click", ()=>{


clicks++;

counter.innerHTML = clicks + "/50";

// 45-től villogni kezd
if(clicks === 45){

    counter.classList.add("flash");

}



// első 20 kattintásig nő

if(clicks <= 20){

    textSize += 5;

    itsme.style.fontSize = textSize + "px";

}



// 49-nél megáll

if(clicks === 49){

    itsme.classList.remove("shake");

}




if(clicks === 50){

    counter.innerHTML = "50/50";
    counter.style.color = "red";

    counter.classList.remove("flash");
    counter.classList.add("flashFast");

}

// 51. kattintás
if(clicks === 51){

    counter.innerHTML = "YOU ARE DEAD";
}

if(clicks === 52){

    itsme.style.display = "none";

    golden.style.display = "block";

    sound.currentTime = 0;
    sound.play();

    setTimeout(()=>{

        window.location.replace("tbr.html");

    },10000);

}


}


);

purpleGuy.addEventListener("click", ()=>{

    spring.style.display = "block";

});

</script>


</body>

</html>
