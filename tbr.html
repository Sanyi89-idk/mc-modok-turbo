<script>

// kisebb szövegek eltűnése

setTimeout(()=>{


document.querySelectorAll("p, ul, li").forEach(element=>{

},180000);

setTimeout(()=>{


document.querySelectorAll("h2,h3,h4,h5,h6").forEach(element=>{

});


},190000);

},200000);

bossText.style.display="block";


},220000);

scare.style.display="flex";

    jumpscareSound.currentTime = 0;
    jumpscareSound.play();
